version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fees_recovery_db
    environment:
      POSTGRES_DB: fees_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fees_recovery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
